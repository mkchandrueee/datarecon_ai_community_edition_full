[project]
name = "datarecon-community"
version = "1.0.0"
description = "DataRecon AI Community Edition — enterprise data validation and reconciliation, single-node."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }
# Core runtime: Streamlit UI, SQLite metadata store, DuckDB+Polars compare
# engine, and the DB-API/SQLAlchemy drivers common enough to ship by default
# (see ADR-0003). Less common enterprise warehouse/bigdata/cloud connectors
# are optional extras so a Community Edition install stays lightweight.
dependencies = [
    "streamlit==1.38.0",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "duckdb>=1.0.0,<2.0.0",
    "polars>=1.9.0,<2.0.0",
    "pyarrow>=14.0.1,<17.0.0",
    "SQLAlchemy==2.0.43",
    "cryptography==43.0.1",
    "python-dotenv==1.0.1",
    "psycopg2-binary==2.9.9",
    "PyMySQL==1.1.1",
    "pyodbc==5.1.0",
    "oracledb==2.4.1",
    "pymongo==4.8.0",
    "openpyxl==3.1.5",
    "lxml==5.3.0",
    "fastavro==1.9.7",
    "xlsxwriter==3.2.0",
    "reportlab==4.2.5",
]

[project.optional-dependencies]
warehouse = [
    "snowflake-sqlalchemy==1.6.1",
    "ibm-db==3.2.3",
    "ibm-db-sa==0.4.1",
    "teradatasqlalchemy==20.0.0.2",
    "sqlalchemy-redshift==1.0.0",
    "redshift-connector==2.1.3",
    "databricks-sqlalchemy==2.0.5",
    "sqlalchemy-hana==2.4.0",
    "hdbcli==2.21.28",
]
bigdata = [
    "PyHive[hive-pure-sasl]==0.7.0",
]
jdbc = [
    "JayDeBeApi==1.2.3",
    "JPype1==1.5.0",
]
cloud = [
    "boto3==1.35.24",
    "azure-storage-blob==12.22.0",
    "azure-storage-file-datalake==12.16.0",
    "azure-identity==1.17.1",
    "google-cloud-storage==2.18.2",
]
all = [
    "datarecon-community[warehouse,bigdata,jdbc,cloud]",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "pandas-stubs>=2.2.0",
]
# Not part of the Community Edition UI (Streamlit, per ADR-0002). Only
# needed to run nicegui_prototype/ — an unwired evaluation of NiceGUI as
# a possible future presentation layer. See nicegui_prototype/README.md.
nicegui-prototype = [
    "nicegui>=3.14.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["datarecon*", "config*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["datarecon", "config"]

[tool.mypy]
python_version = "3.11"
packages = ["datarecon", "config"]
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["tests/", "data/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=datarecon --cov=config --cov-report=term-missing --cov-report=xml"
markers = ["slow: exercises larger synthetic datasets; excludable with -m 'not slow'"]

[tool.coverage.run]
branch = true
source = ["datarecon", "config"]
omit = ["*/presentation/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
